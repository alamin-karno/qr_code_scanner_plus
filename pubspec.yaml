name: qr_code_scanner_plus
description: A Flutter QR & barcode scanner plugin using native platform views (ZXing on Android, MTBBarcodeScanner on iOS). Fork of qr_code_scanner with Dart 3 and Flutter 3.x compatibility fixes.
version: 1.1.0
homepage: https://github.com/alamin-karno/qr_code_scanner_plus
repository: https://github.com/alamin-karno/qr_code_scanner_plus

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  js: ^0.7.1
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^1.0.4

flutter:
  plugin:
    platforms:
      android:
        package: net.touchcapture.qr.flutterqr
        pluginClass: FlutterQrPlugin
      ios:
        pluginClass: SwiftFlutterQrPlugin
#      web:
#        pluginClass: FlutterQrPlugin
#        fileName: flutter_qr_web.dart
